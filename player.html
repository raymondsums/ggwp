// Messages from the game master. Unread ones pop up over everything until
// tapped away, one at a time, oldest first. What has been seen is kept per
// phone, so a refresh does not bring old ones back.
const SEEN_KEY = `ggwp-seen-${CODE}`;
let lastBuzz = 0;
function seenUpTo() { return +(store.get(SEEN_KEY) || 0); }
function showMessages(s) {
    let box = document.getElementById('msg-pop');
    const unread = (s.messages || []).filter(m => m.id > seenUpTo());
    if (!unread.length) { box?.remove(); return; }
    const m = unread[0];
    if (m.id > lastBuzz) { lastBuzz = unread[unread.length - 1].id; try { navigator.vibrate?.([120, 60, 120]); } catch (e) {} }
    if (!box) {
        box = document.createElement('div');
        box.id = 'msg-pop';
        box.className = 'msg-pop';
        box.setAttribute('role', 'alertdialog');
        document.body.appendChild(box);
    }
    if (box.dataset.id === String(m.id)) return;
    box.dataset.id = m.id;
    box.innerHTML = `
        <div class="screen">
            <div class="screen-top"><span><i class="led on blink"></i>Game master</span><span>${esc(m.scope)}</span></div>
            <div class="msg-text">${esc(m.text)}</div>
            ${unread.length > 1 ? `<div class="screen-line">${unread.length - 1} more after this</div>` : ''}
        </div>
        <button class="key dark" id="msg-ok">Got it</button>`;
    box.querySelector('#msg-ok').addEventListener('click', () => {
        store.set(SEEN_KEY, m.id);
        box.dataset.id = '';
        showMessages(state);
    });
}

function messageList(s) {
    const ms = (s.messages || []).slice().reverse();
    if (!ms.length) return '';
    return `
    <div class="answers">
        <div class="engr">From the game master</div>
        ${ms.map(m => `<div class="answer"><span>${esc(m.text)}</span><time>${ago(m.t)}</time></div>`).join('')}
    </div>`;
}

// Updates arrive twice a second. Rebuilding the buttons that often loses
// taps, so a box is only redrawn when more than a ticking clock changed.
// The clocks themselves are moved by the one second timer in startGame.
const TICKING = /(<[^>]*id="(?:ch-timer|ch-wait|next-hint|mark-walk|pace-status|checkin-rest|cool|meld-timer)"[^>]*>)[^<]*/g;
function put(el, html) {
    const key = html.replace(TICKING, '$1');
    if (el.dataset.key === key) return;
    el.dataset.key = key;
    el.innerHTML = html;
}
// For when the page changed a button itself (disabled it while sending).
function redraw() {
    for (const id of ['main', 'actions']) { const el = document.getElementById(id); if (el) el.dataset.key = ''; }
    if (state) render(state);
}

const scoreSeen = {}, bumpUntil = {};
function render(s) {
    document.body.className = s.me.team;
    // Before the start there's no race to show, so the score and bars hide.
    document.body.classList.toggle('in-lobby', s.status === 'lobby');
    showMessages(s);
    document.getElementById('team-name').textContent = s.me.name;
    document.getElementById('me-led').className = `led ${s.me.team}`;
    const idx = Object.fromEntries(s.race.map(r => [r.team, r.index]));
    // A team that just cleared a stop gets its number popped and its new bar
    // segment flashed, for a second or so.
    const nowMs = Date.now();
    if (s.status === 'running') {
        for (const r of s.race) {
            const was = scoreSeen[r.team];
            if (was != null && r.index > was) bumpUntil[r.team] = nowMs + 1200;
            scoreSeen[r.team] = r.index;
        }
    }
    const bumping = t => bumpUntil[t] > nowMs;
    put(document.getElementById('score'), '<i class="score-label">Stops</i>' + s.race.map(r => `<span class="${r.team} ${bumping(r.team) ? 'bump' : ''}">${r.index}</span>`).join('<i>·</i>'));
    const bar = (t, i) => `<div class="race-row"><span class="engr">${t[0].toUpperCase() + t.slice(1)}</span><div class="bar ${t}">${Array.from({ length: s.total }, (_, k) => `<b class="${k < i ? 'on' : ''} ${k === s.total - 1 ? 'star' : ''} ${k === i - 1 && bumping(t) ? 'flash' : ''}"></b>`).join('')}</div></div>`;
    put(document.getElementById('race'), s.race.map(r => bar(r.team, r.index)).join(''));
    if (Object.values(bumpUntil).some(u => u > nowMs)) setTimeout(() => state && render(state), 1300);

    const main = document.getElementById('main');
    const actions = document.getElementById('actions');

    if (s.status === 'lobby') {
        put(main, lobbyHtml(s));
        const ls = document.getElementById('lobby-scene');
        if (ls && !ls.dataset.on) { ls.dataset.on = '1'; parkScene(ls, { walkers: ls.dataset.walkers.split(',').filter(Boolean).map(t => css(`--${t}-led`)) }); }
        const writing = s.riddles_status === 'writing';
        const empty = Object.entries(s.roster).find(([, ps]) => !ps.length);
        put(actions, (s.mode === 'self'
            ? `<button class="key dark" id="self-start" ${writing || empty || teamsBusy ? 'disabled' : ''}>${teamsBusy ? 'Picking routes' : empty ? `Waiting for ${cap(empty[0])}` : writing ? 'Setting up game' : 'Start game'}</button>`
            : `<div class="feed"><div>The game master starts the clock. Your first clue shows up here.</div></div>`)
            + `<button class="key" id="exit">Exit</button>`);
        return;
    }
    if (s.status === 'finished') {
        if (s.winner && !s.closed) { put(main, endHtml(s)); startEnd(s); startReplay(s); }
        else put(main, `<div class="status-wrap"><div class="screen"><div class="screen-top"><span><i class="led on"></i>Game over</span></div><div class="big-line">${s.closed ? 'The game master closed this game' : s.ended_on_time ? "Time's up. It's a tie" : 'The game master ended the game'}</div>${s.final ? `<div class="screen-line">The final spot was ${esc(s.final.name)}.</div>` : ''}</div>${s.replay ? replayHtml() : ''}${s.final ? mapsKey(s.final, 'Show in Maps') : ''}</div>`);
        startReplay(s);
        put(actions, `<button class="key" id="done">Done</button>`);
        return;
    }

    if (s.challenge) { renderChallenge(s); return; }
    const st = s.stop;
    const hints = st.hints.slice(1);
    put(main, `
    <div class="clue-card">
        <div class="clue-head">
            <span class="label ${st.final ? 'final-tag' : ''}">${st.final ? 'Final spot' : `Stop ${s.index + 1} of ${s.total - 1}`}${st.type === 'quiet' ? ' · hidden spot' : ''}</span>
        </div>
        <div class="clue">${esc(st.hints[0].text)}</div>
        ${hints.length ? `<div class="hints">${hints.map(h => `<div>${esc(h.text)}${h.pin ? mapsKey(h.pin, 'Directions', true) : h.circle ? mapsKey(h.circle, 'Show point in Maps') : ''}</div>`).join('')}</div>` : ''}
        ${st.next_hint_at ? `<div class="next-hint" id="next-hint">Next hint in ${mmss(st.next_hint_at - s.now)}</div>` : ''}
    </div>
    ${messageList(s)}`);

    put(actions, `
        ${checkinKey(s)}
        ${s.mode === 'self' ? '' : `<button class="key small-link" id="here" ${s.pending ? 'disabled' : ''}>${s.pending ? 'Waiting for the game master' : 'Location acting up? Ask the game master'}</button>`}
`);
}

function ago(t) {
    const m = Math.max(0, Math.round((state.now - t) / 60));
    return m < 1 ? 'now' : `${m} min ago`;
}

// Getting somewhere is Google Maps' job. Directions for a spot to walk to, a
// plain pin for a point to search around.
function mapsKey(p, label, walk) {
    const url = walk
        ? `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}&travelmode=walking`
        : `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lon}`;
    return `<a class="key maps" href="${url}" target="_blank" rel="noopener">${label}</a>`;
}

// A check-in takes its own readings rather than trusting the last one sent:
// a few seconds of fresh fixes, keeping the most accurate. GPS under trees
// jumps around, and the best of several is much steadier than any one.
function freshReading() {
    if (SIM || !navigator.geolocation) return Promise.resolve(myPos ? { ...myPos, t: Date.now() / 1000 } : null);
    return new Promise(resolve => {
        let best = null;
        const done = () => { navigator.geolocation.clearWatch(id); clearTimeout(timer); resolve(best || (myPos ? { ...myPos } : null)); };
        const id = navigator.geolocation.watchPosition(p => {
            const fix = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy, t: Date.now() / 1000 };
            if (!best || fix.acc < best.acc) best = fix;
            if (best.acc <= 12) done();
        }, () => {}, { enableHighAccuracy: true, maximumAge: 0, timeout: 8000 });
        const timer = setTimeout(done, 6000);
    });
}

// Every move goes through here. With no signal it says so plainly instead of
// failing silently, and position fixes keep queueing for later.
// Set while a new team count is being planned, so the lobby can say so.
let teamsBusy = 0;
// Names seen in the lobby, so a new arrival pops in once and buzzes.
const seenAt = {};
let lobbyPrimed = false;
const cap = t => t[0].toUpperCase() + t.slice(1);

function lobbyHtml(s) {
    const now = Date.now();
    const teams = Object.keys(s.roster);
    const all = teams.flatMap(t => s.roster[t]);
    let arrived = false;
    for (const p of all) {
        if (!(p.pid in seenAt)) { seenAt[p.pid] = lobbyPrimed ? now : 0; if (lobbyPrimed && !p.me) arrived = true; }
    }
    lobbyPrimed = true;
    if (arrived) { try { navigator.vibrate?.(40); } catch (e) {} setTimeout(() => state && render(state), 700); }
    const self = s.mode === 'self';
    const sizes = teams.map(t => s.roster[t].length);
    const lopsided = Math.max(...sizes) - Math.min(...sizes) >= 2;
    const len = LENGTHS.find(l => l.m === s.minutes);
    const col = t => {
        const ps = s.roster[t];
        const mine = t === s.me.team;
        const removable = self && t === 'yellow';
        return `<div class="colwrap ${removable ? 'removable' : ''}">
            <button class="col ${t} ${mine ? 'mine' : ''}" ${mine ? 'aria-current="true"' : `data-switch="${t}" aria-label="Switch to ${cap(t)}"`}>
                <div class="col-head"><i class="led"></i>${t.toUpperCase()}<b>${ps.length}</b></div>
                <div class="tags">${ps.map(p => `<div class="tag ${p.me ? 'me' : ''} ${now - seenAt[p.pid] < 600 ? 'pop' : ''}"><i>${esc(Array.from(p.name.trim())[0] || '?').toUpperCase()}</i><span lang="en">${esc(p.name)}${p.me ? ' <em class="sr">(you)</em>' : ''}</span></div>`).join('') || '<div class="tag open">Open</div>'}</div>
                <div class="col-foot">${mine ? 'Your team' : 'Switch'}</div>
            </button>
            ${removable ? `<button class="col-x" data-teams="2" aria-label="Remove the yellow team" ${teamsBusy ? 'disabled' : ''}>✕</button>` : ''}
        </div>`;
    };
    const canAdd = self && teams.length === 2;
    const last = s.events.slice().reverse().find(e => / joined | switched to |shuffled|team added|team removed/.test(e.text));
    return `<div class="status-wrap">
        <div class="screen">
            <div class="screen-top"><span><i class="led on blink"></i>Lobby</span><span>Game ${esc(s.code)}</span></div>
            <div class="big-line">Meet at ${esc(s.start.name)}</div>
            <div class="lobby-meta">${len ? `${len.name} · ` : ''}${Math.floor(s.minutes / 60)}:${String(s.minutes % 60).padStart(2, '0')} · ${s.total - 1} stops + final · ${all.length} ${all.length === 1 ? 'player' : 'players'}</div>
        </div>
        <div class="board" style="--cols:${teams.length}">
            ${teams.map(col).join('')}
             ${canAdd ? `<div class="colwrap add-row"><button class="col add" data-teams="3" ${teamsBusy ? 'disabled' : ''}>${teamsBusy ? 'Picking routes' : '<span>+</span>Add yellow team'}</button></div>` : ''}
        </div>
        <div class="lobby-tools">
            <div class="ticker">${last ? `<i class="led on"></i>${esc(last.text)}` : ''}</div>
        </div>
        ${lopsided ? `<div class="lobby-note">${teams.map(t => `${cap(t)} has ${s.roster[t].length}`).join(', ')}. Switch to even it out.</div>` : ''}
        <div class="lobby-hero">
            <canvas class="scene" id="lobby-scene" data-walkers="${teams.flatMap(t => s.roster[t].map(() => t)).join(',')}" aria-hidden="true"></canvas>
            <div class="lh-title">${all.length < 2 ? 'Get your friends in' : `${all.length} of you so far`}</div>
            <div class="lh-text">Send them the link or show the QR code. Start once every team has someone.</div>
        </div>
        <div class="lobby-keys">
            <button class="key" id="invite">Invite players</button>
        </div>
    </div>`;
}

// ------------------------------------------------------------ arriving

// Checking in at the right spot gets a moment of its own: a stamp with the
// spot's name, a burst of confetti in the team color, and a buzz. A tap or
// a few seconds clears it to the challenge underneath.
function arrivedAt(s) {
    const c = s.challenge;
    celebrate(`Welcome to Stop ${s.index + 1}`, c.stop_name, `Challenge unlocked: ${c.name}`, 'welcome');
}

// The green card used for every good moment: arriving, clearing a stop.
// Arriving is a welcome, not a win yet: a neutral card with a pin and no
// confetti. Clearing a challenge is the green card with confetti.
const CHECK_ICON = '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const AGAIN_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>';
const PIN_ICON = '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
function celebrate(title, line, next, kind = 'win') {
    try { navigator.vibrate?.(kind === 'win' ? [60, 40, 60, 40, 160] : [80, 60, 80]); } catch (e) {}
    document.querySelector('.arrive')?.remove();
    const el = document.createElement('div');
    el.className = `arrive ${kind}`;
    el.innerHTML = `<div class="arrive-card">
        <div class="arrive-check">${kind === 'win' ? CHECK_ICON : PIN_ICON}</div>
        <div class="arrive-title">${esc(title)}</div>
        <div class="arrive-spot">${esc(line)}</div>
        <div class="arrive-next">${esc(next)}</div>
    </div>`;
    document.body.appendChild(el);
    const close = () => { el.classList.add('out'); setTimeout(() => el.remove(), 250); };
    el.addEventListener('click', close);
    setTimeout(close, 3200);
    if (kind === 'win' && !matchMedia('(prefers-reduced-motion: reduce)').matches) confetti([css('--ok'), css('--final'), '#ffffff']);
}

// ------------------------------------------------------------ the end

// Someone won: fireworks in the winner's color over the park, a big
// headline, and how far every team got. The winners also get confetti.
function endHtml(s) {
    const won = s.winner === s.me.team;
    const took = s.finished_at && s.started ? s.finished_at - s.started : null;
    const mins = took ? Math.max(1, Math.round(took / 60)) : 0;
    const hm = mins ? (mins >= 60 ? `${Math.floor(mins / 60)} hr ${mins % 60} min` : `${mins} min`) : '';
    const mine = s.race.find(r => r.team === s.me.team);
    const stops = s.total;
    const how = s.ended_on_time
        ? `Time ran out. ${cap(s.winner)} made it the furthest.`
        : `${cap(s.winner)} reached ${s.final ? esc(s.final.name) : 'the final spot'} first${hm ? `, in ${hm}` : ''}.`;
    const rows = s.race.slice().sort((a, b) => b.index - a.index).map(r => `
        <div class="end-row ${r.team} ${r.team === s.winner ? 'lead' : ''}">
            <span><i class="led ${r.team}"></i>${cap(r.team)}${r.team === s.me.team ? ' (you)' : ''}</span>
            <div class="bar ${r.team}">${Array.from({ length: stops }, (_, k) => `<b class="${k < r.index ? 'on' : ''} ${k === stops - 1 ? 'star' : ''}"></b>`).join('')}</div>
            <em>${r.team === s.winner && !s.ended_on_time ? 'Finished' : `${Math.min(r.index, stops - 1)} of ${stops - 1}`}</em>
        </div>`).join('');
    return `<div class="status-wrap"><div class="screen end ${won ? 'won' : ''}" style="--wc: var(--${s.winner}-led)">
        <div class="screen-top"><span><i class="led on blink"></i>Game over</span><span>GG, well played</span></div>
        <canvas class="scene" id="end-scene" aria-hidden="true"></canvas>
        <div class="end-title">${won ? 'You won!' : `${cap(s.winner)} wins`}</div>
        <div class="end-sub">${how}${won ? '' : ` Your team got ${Math.min(mine?.index || 0, stops - 1)} of ${stops - 1} stops.`}</div>
        <div class="end-board">${rows}</div>
    </div>${s.replay ? replayHtml() : ''}${s.final ? mapsKey(s.final, 'Show the final spot in Maps') : ''}</div>`;
}

// The whole game replayed on a map in about 20 seconds: each team's path
// draws itself in its color, stops light up as they were reached, and a
// clock shows the game time going by.
const REPLAY_MS = 20000;
function replayHtml() {
    return `<div class="replay">
        <div class="replay-head"><span><i class="led on"></i>Replay</span><span class="replay-clock" id="rp-clock">0:00:00</span><button class="mini-key" id="rp-again" aria-label="Play the replay again">${AGAIN_ICON}</button></div>
        <div class="rp-map" id="rp-map"></div>
    </div>`;
}

function startReplay(s) {
    const el = document.getElementById('rp-map');
    if (!el || el.dataset.on || !s.replay || typeof maplibregl === 'undefined') return;
    el.dataset.on = '1';
    const T = Math.max(60, (s.finished_at || s.now) - s.started);
    const teams = Object.keys(s.replay);
    const pts = teams.flatMap(t => s.replay[t].path.map(p => [p[2], p[1]]));
    if (s.final) pts.push([s.final.lon, s.final.lat]);
    const m = new maplibregl.Map({
        container: el,
        style: `https://tiles.openfreemap.org/styles/${dark ? 'dark' : 'positron'}`,
        center: pts[0] || [-122.4836, 37.7694], zoom: 14,
        attributionControl: { compact: true },
    });
    m.once('load', () => el.querySelector('.maplibregl-ctrl-attrib')?.classList.remove('maplibregl-compact-show'));
    if (pts.length > 1) m.fitBounds(pts.reduce((b, c) => b.extend(c), new maplibregl.LngLatBounds(pts[0], pts[0])), { padding: 36, duration: 0, maxZoom: 16 });
    const clock = document.getElementById('rp-clock');
    const hms = x => `${Math.floor(x / 3600)}:${String(Math.floor((x % 3600) / 60)).padStart(2, '0')}:${String(Math.floor(x % 60)).padStart(2, '0')}`;
    // Where a team was at game time gt: every point so far, plus a head
    // part way to the next one so the line moves smoothly.
    const upTo = (path, gt) => {
        const out = [];
        for (let i = 0; i < path.length; i++) {
            const p = path[i];
            if (p[0] <= gt) { out.push([p[2], p[1]]); continue; }
            const q = path[i - 1];
            if (q) { const f = (gt - q[0]) / (p[0] - q[0]); out.push([q[2] + (p[2] - q[2]) * f, q[1] + (p[1] - q[1]) * f]); }
            break;
        }
        return out;
    };
    let t0 = null, raf = null, ready = false;
    function draw(gt) {
        if (!ready) return;
        for (const t of teams) {
            const line = upTo(s.replay[t].path, gt);
            m.getSource(`rp-${t}`).setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: line.length > 1 ? line : [] } });
            const feats = s.replay[t].hits.filter(h => h[0] <= gt).map(h => ({ type: 'Feature', properties: { kind: 'hit' }, geometry: { type: 'Point', coordinates: [h[2], h[1]] } }));
            if (line.length) feats.push({ type: 'Feature', properties: { kind: 'head' }, geometry: { type: 'Point', coordinates: line[line.length - 1] } });
            m.getSource(`rp-${t}-pts`).setData({ type: 'FeatureCollection', features: feats });
        }
        clock.textContent = hms(gt);
    }
    function frame(now) {
        if (!el.isConnected) return;
        if (t0 === null) t0 = now;
        const p = Math.min(1, (now - t0) / REPLAY_MS);
        draw(p * T);
        if (p < 1) raf = requestAnimationFrame(frame);
    }
    function play() {
        cancelAnimationFrame(raf);
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) { draw(T); return; }
        t0 = null; raf = requestAnimationFrame(frame);
    }
    m.on('load', () => {
        if (s.final) {
            m.addSource('rp-final', { type: 'geojson', data: { type: 'Feature', geometry: { type: 'Point', coordinates: [s.final.lon, s.final.lat] } } });
            m.addLayer({ id: 'rp-final', type: 'circle', source: 'rp-final', paint: { 'circle-radius': 9, 'circle-color': css('--final'), 'circle-opacity': 0.25, 'circle-stroke-width': 2, 'circle-stroke-color': css('--final') } });
        }
        for (const t of teams) {
            const col = css(`--${t}-led`);
            m.addSource(`rp-${t}`, { type: 'geojson', data: { type: 'Feature', geometry: { type: 'LineString', coordinates: [] } } });
            m.addLayer({ id: `rp-${t}`, type: 'line', source: `rp-${t}`, layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': col, 'line-width': 4, 'line-opacity': 0.9 } });
            m.addSource(`rp-${t}-pts`, { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
            m.addLayer({ id: `rp-${t}-hits`, type: 'circle', source: `rp-${t}-pts`, filter: ['==', ['get', 'kind'], 'hit'], paint: { 'circle-radius': 5, 'circle-color': col, 'circle-stroke-width': 2, 'circle-stroke-color': '#ffffff' } });
            m.addLayer({ id: `rp-${t}-head`, type: 'circle', source: `rp-${t}-pts`, filter: ['==', ['get', 'kind'], 'head'], paint: { 'circle-radius': 7, 'circle-color': '#ffffff', 'circle-stroke-width': 3, 'circle-stroke-color': col } });
        }
        ready = true;
        play();
    });
    document.getElementById('rp-again').addEventListener('click', play);
}

function startEnd(s) {
    const c = document.getElementById('end-scene');
    if (c && !c.dataset.on) { c.dataset.on = '1'; parkScene(c, { fireworks: css(`--${s.winner}-led`) }); }
    // Confetti and a long buzz, once, for the team that won.
    const key = `ggwp-cheered-${CODE}`;
    if (s.winner !== s.me.team || sessionStorage.getItem(key)) return;
    try { sessionStorage.setItem(key, '1'); } catch (e) {}
    try { navigator.vibrate?.([100, 60, 100, 60, 300]); } catch (e) {}
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    confetti([css(`--${s.winner}-led`), css('--final'), '#ffffff']);
}

function confetti(colors) {
    const cv = document.createElement('canvas');
    cv.className = 'confetti';
    document.body.appendChild(cv);
    const dpr = devicePixelRatio || 1;
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    const g = cv.getContext('2d');
    g.scale(dpr, dpr);
    const bits = Array.from({ length: 140 }, (_, i) => ({
        x: innerWidth / 2 + (Math.random() - 0.5) * 60, y: innerHeight * 0.35,
        vx: (Math.random() - 0.5) * 14, vy: -6 - Math.random() * 10,
        r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.4,
        w: 5 + Math.random() * 5, h: 3 + Math.random() * 4, c: colors[i % colors.length],
    }));
    const t0 = performance.now();
    (function tick(now) {
        const t = now - t0;
        g.clearRect(0, 0, innerWidth, innerHeight);
        for (const b of bits) {
            b.vy += 0.32; b.vx *= 0.985; b.x += b.vx; b.y += b.vy; b.r += b.vr;
            g.save(); g.translate(b.x, b.y); g.rotate(b.r);
            g.globalAlpha = Math.max(0, 1 - Math.max(0, t - 2600) / 900);
            g.fillStyle = b.c; g.fillRect(-b.w / 2, -b.h / 2, b.w, Math.abs(Math.cos(b.r * 2)) * b.h + 1);
            g.restore();
        }
        if (t < 3500) requestAnimationFrame(tick); else cv.remove();
    })(t0);
}

// The join link and QR live one tap away, in a sheet over the lobby.
function openInvite() {
    const link = `${SHARE_ORIGIN}/?g=${CODE}`;
    const sheet = document.createElement('div');
    sheet.className = 'invite-wrap';
    sheet.innerHTML = `<div class="msg-pop invite-pop" role="dialog" aria-label="Invite players">
        <div class="screen">
            <div class="screen-top"><span><i class="led on blink"></i>Invite players</span><span>Game ${esc(CODE)}</span></div>
            <div class="screen-line" style="border:0;margin-top:8px;padding-top:0">Scan the code, or send the link.</div>
            ${qrSvg(link)}
        </div>
        <div class="slot-row"><span>${esc(link)}</span><button class="key" id="share">Share</button></div>
        <button class="key" id="invite-close">Close</button>
    </div>`;
    document.body.appendChild(sheet);
    sheet.addEventListener('click', e => { if (e.target === sheet || e.target.closest('#invite-close')) sheet.remove(); });
}

async function api(path, body) {
    try {
        const r = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
        return await r.json().catch(() => ({ ok: false, message: 'Something went wrong' }));
    } catch (e) {
        setNet(false);
        toast('No signal. Try again when the light is back');
        return null;
    }
}

// Arriving is a check-in: the team taps when they think they're at the
// stop, and the phone's position decides. A wrong one rests the key for a
// minute, so tapping it every few steps doesn't work.
let checkingIn = false;
function checkinKey(s) {
    if (checkingIn) return `<button class="key dark" id="checkin" disabled>Checking location</button>`;
    const rest = s.checkin_locked_until ? s.checkin_locked_until - s.now : 0;
    return `<button class="key dark" id="checkin" ${rest > 0 ? 'disabled' : ''}>${rest > 0 ? `Check in <span id="checkin-rest">${mmss(rest)}</span>` : 'Check in'}</button>`;
}

function feed(s) {
    return s.events.slice(-4).reverse().map(e => `<div>${esc(e.text)}</div>`).join('');
}

function drawMap(s) {
    if (!map || !mapReady) return;
    markers.forEach(m => m.remove());
    markers = [];
    const add = (node, lat, lon, anchor = 'center') => markers.push(new maplibregl.Marker({ element: node, anchor }).setLngLat([lon, lat]).addTo(map));

    if (s.status === 'lobby') add(el('meet', esc(s.start.name)), s.start.lat, s.start.lon, 'bottom');
    s.found.forEach((f, i) => add(el('found', i + 1), f.lat, f.lon));
    for (const m of s.teammates) {
        if (m.me || m.lat == null) continue;
        add(el('mate', `<i></i><span>${esc(m.name)}</span>`), m.lat, m.lon, 'top');
    }
    if (myPos) add(el('me-dot'), myPos.lat, myPos.lon);

    // Answers this stop: a yes is a filled circle, a no is an empty ring.
    const tc = css('--tc');
    map.getSource('asks').setData({ type: 'FeatureCollection', features: s.answers.filter(a => a.size).map(a =>
        circle(a.at[0], a.at[1], a.size, { color: tc, opacity: a.a === 'Yes' ? 0.16 : 0.0 })) });
    // The last two hints: a search circle, then the spot itself.
    const shown = s.status === 'running' && s.stop ? s.stop.hints : [];
    const area = [...shown].reverse().find(h => h.circle)?.circle;
    const pin = shown.find(h => h.pin)?.pin;
    map.getSource('search').setData(area && !pin ? circle(area.lat, area.lon, area.r, {}) : empty());
    if (pin) add(el('goal', '★'), pin.lat, pin.lon);
    const focus = pin || area;
    const focusKey = focus ? `${s.index}:${pin ? 'pin' : 'circle'}` : null;
    if (focusKey && focusKey !== drawMap.focused) {
        drawMap.focused = focusKey;
        follow = false;
        map.easeTo({ center: [focus.lon, focus.lat], zoom: 17, duration: 800 });
    }
    map.getSource('mark').setData(s.mark ? { type: 'Feature', geometry: { type: 'Point', coordinates: [s.mark[1], s.mark[0]] } } : empty());

    if (!drawMap.centered) {
        drawMap.centered = true;
        const c = myPos || s.start;
        map.jumpTo({ center: [c.lon, c.lat], zoom: 16 });
    }
}

// ------------------------------------------------------------ challenges

// What each phone is typing stays on the phone until it is sent, so a live
// update from a teammate does not wipe a half-typed guess.
let draft = '';
let draftFor = null;

// The challenge intro: a one-line goal, rules as short rows that each
// show a tiny example, and the numbers that matter as chips.
const mini = (cls, t = '') => `<span class="mini ${cls}">${t}</span>`;
const miniCard = (n, suit) => `<span class="mini pc ${SUIT[suit].red ? 'red' : ''}">${n}${SUIT[suit].sym}</span>`;
const INTRO = {
    wordle: c => ({ goal: 'Guess the five-letter word', rules: [
        [mini('g', 'A'), 'Green is the right letter in the right spot'],
        [mini('y', 'R'), 'Yellow is in the word, but somewhere else'],
        [mini('x', 'T'), 'Gray is not in the word'],
    ], stats: [[c.max, 'tries']] }),
    lock: c => ({ goal: `Crack the ${c.digits}-digit code`, rules: [
        [mini('g', '2'), 'A digit in the right spot'],
        [mini('y', '7'), 'A digit in the code, wrong spot'],
        [mini('', '\u2260'), 'No digit repeats'],
    ], stats: [[c.max, 'tries']] }),
    switch: c => ({ goal: 'Turn every light off', rules: [
        [mini('lit'), 'A press flips that switch and the ones next to it'],
        ...(c.mine && c.mine.some(m => !m) ? [[mini('', 'JO'), 'Each of you controls some switches. Talk it through']] : []),
        [mini('', '\u21BA'), 'Reset puts the lights back but keeps the moves used'],
    ], stats: [[c.max, 'moves']] }),
    highlow: c => ({ goal: `Reach ${c.target} points`, rules: [
        [miniCard(7, 'hearts'), 'Is the next card, A to 10, higher or lower?'],
        [mini('', '+1+2'), 'Right calls in a row are worth more: 1, then 2, then 3'],
        [mini('bank', 'BANK'), 'Bank to keep your points. A wrong call loses the rest'],
        [mini('boom', '3:00'), 'A wrong call also costs a 3 minute wait. Ties lose'],
    ], stats: [[c.target, 'points']] }),
    tiles: c => ({ goal: `Open ${c.need} safe tiles`, rules: [
        [mini('', '2'), 'A number is how many traps touch that tile, corners too'],
        [mini('boom', '\u2715'), `${c.traps} tiles are traps`],
        [mini('g', '\u2713'), 'Your first tile is always safe'],
    ], stats: [[c.need, 'safe tiles']] }),
    clock: c => ({ goal: 'Feel the time pass', rules: [
        [mini('', '0:05'), 'A timer shows for 5 seconds, then hides'],
        [mini('lit', 'TAP'), 'Everyone taps when they think the target time has passed'],
        [mini('', `\u00B1${c.buffer}s`), `Your team's average has to land within ${c.buffer} ${c.buffer === 1 ? 'second' : 'seconds'}`],
        [mini('boom', '!'), 'Stay on this screen while it runs. Leaving counts as a miss'],
    ], stats: [[c.tries_left, 'tries']] }),
    meld: c => ({ goal: 'Think alike', rules: [
        [mini('', `${c.need_apart}m`), `Two of you stand at least ${c.need_apart} m apart`],
        [mini('', '10s'), `You both get the same ${c.rounds} questions, 10 seconds each`],
        [mini('g', '='), 'Pick the same answer without talking. For trivia, both need the right one'],
    ], stats: [[c.need, 'matches'], [c.rounds, 'rounds']] }),
    pace: c => ({ goal: 'Find the spot', rules: [
        [mini('', '\u2192'), 'Walk to the spot described'],
        [mini('lit', '10s'), 'Hold still there for 10 seconds. Anyone on the team can do it'],
    ], stats: [] }),
};

const HOW = {
    wordle: n => `Guess the five-letter word in ${n} tries. Green is the right letter in the right spot, yellow is in the word somewhere else.`,
    lock: (n, d) => `Crack the ${d}-digit code in ${n} tries. No digit repeats. Each try tells you how many digits are in the right spot, and how many are in the code but in the wrong spot.`,
    switch: (n, size, shared) => `Turn every light off. Pressing a switch flips it and the ones next to it. ${shared ? 'Each of you controls only some switches, so talk it through. ' : ''}You have ${n} moves. Reset puts the lights back but keeps the moves used.`,
    pace: () => `Walk to the spot described, then hold still there for 10 seconds. Anyone on the team can do it.`,
    highlow: c => `Reach ${c.target} points. Bet whether the next card, 1 to 10, is higher or lower than yours. Right calls in a row are worth more: 1, then 2, then 3. Bank to keep your points. A wrong call loses what you haven't banked and costs a 3 minute wait. Ties lose.`,
    tiles: c => `Open ${c.need} safe tiles. ${c.traps} are traps. Each open tile shows how many traps touch it, sides and corners. Your first tile is always safe.`,
    clock: c => `A timer starts, shows for 5 seconds, then hides. Everyone on the team taps when they think the target time has passed. Your team's average has to land within ${c.buffer} ${c.buffer === 1 ? 'second' : 'seconds'} of it. ${c.tries_left} tries. Stay on this screen while it runs, leaving it counts as a miss.`,
    meld: c => `Two of you stand at least ${c.need_apart} m apart, then start. You'll both get the same ${c.rounds} questions, 10 seconds each. Pick the same answer without talking. For trivia you both need the right one. ${c.need} matches to pass.`,
};

function chPhase(c, now) {
    if (c.locked_until && now < c.locked_until) return 'waiting';
    return c.started ? 'playing' : 'ready';
}

// Writes go through put(), so an update that only moved a clock leaves the
// keys alone.
function sink(id) { const el = document.getElementById(id); return { set innerHTML(h) { put(el, h); } }; }

function renderChallenge(s) {
    const c = s.challenge;
    const main = sink('main');
    const actions = sink('actions');
    const key = `${s.index}:${c.kind}:${c.fails}`;
    if (draftFor !== key) { draft = ''; draftFor = key; }
    const phase = chPhase(c, s.now);
    const head = `<div class="screen-top"><span><i class="led on ${phase === 'playing' ? 'blink' : ''}"></i>Stop ${s.index + 1} · ${esc(c.stop_name)}</span><span>${esc(c.name)}</span></div>`;

    if (phase === 'waiting') {
        main.innerHTML = `<div class="status-wrap"><div class="screen">
            ${head}
            <div class="big-line">Next try in</div>
            <div class="ch-clock" id="ch-wait">${mmss(c.locked_until - s.now)}</div>
            ${c.kind === 'highlow' && c.started
                ? `<div class="screen-line">Wrong call${c.last ? `: drew ${cardFace(c.last.next)}` : ''}. ${c.score ? `Your ${c.score} banked ${c.score === 1 ? 'point is' : 'points are'} safe.` : 'Nothing was banked yet.'}</div>`
                : `<div class="screen-line">${c.last_fail ? `${esc(c.last_fail.why[0].toUpperCase() + c.last_fail.why.slice(1))}. ${esc(c.last_fail.reveal)}.<br>` : ''}${c.fails >= 3 ? 'The next one is easier.' : `A new puzzle is waiting after this. After ${3 - c.fails} more ${3 - c.fails === 1 ? 'miss' : 'misses'}, you get an easier one.`}</div>`}
        </div></div>`;
        actions.innerHTML = '';
        return;
    }
    if (phase === 'ready') {
        const it = INTRO[c.kind](c);
        const stats = c.kind === 'meld' ? it.stats : [...it.stats, [10, 'minutes']];
        main.innerHTML = `<div class="status-wrap"><div class="screen intro">
            ${head}
            <div class="engr-dark">You've got a challenge${c.level < 0 ? ' · easier one' : ''}</div>
            <div class="big-line">${esc(c.name)}</div>
            <div class="intro-goal">${esc(it.goal)}</div>
            <div class="intro-rules">${it.rules.map(([icon, text]) => `<div class="rule">${icon}<span>${esc(text)}</span></div>`).join('')}</div>
            <div class="intro-stats">${stats.map(([v, l]) => `<div><b>${v}</b><span>${l}</span></div>`).join('')}<div class="fail"><b>5:00</b><span>wait if you fail</span></div></div>
            ${c.kind === 'meld' ? `<div class="apart ${c.apart >= c.need_apart ? 'ok' : ''}">${c.apart == null ? 'Waiting for two of you to share location' : `You're ${c.apart} m apart${c.apart >= c.need_apart ? '. Ready' : `. Get to ${c.need_apart} m`}`}</div>` : ''}
        </div></div>`;
        actions.innerHTML = `<button class="key dark" data-ch="start">Start</button>`;
        return;
    }

    const left = c.deadline - s.now;
    const bar = `<div class="ch-bar"><span class="ch-name">${esc(c.name)}</span><span class="ch-timer ${left < 60 ? 'low' : ''}" id="ch-timer">${mmss(left)}</span><span class="ch-left">${chLeft(c)}</span></div>`;
    if (c.kind === 'wordle') { main.innerHTML = bar + wordleBoard(c); actions.innerHTML = wordleKeys(c); }
    if (c.kind === 'lock') { main.innerHTML = bar + lockBoard(c); actions.innerHTML = lockKeys(c); }
    if (c.kind === 'switch') { main.innerHTML = bar + switchBoard(c); actions.innerHTML = `<button class="key" data-ch="reset">Reset board</button>`; }
    if (c.kind === 'highlow') { main.innerHTML = bar + highlowBoard(c); actions.innerHTML = highlowKeys(c); }
    if (c.kind === 'tiles') { main.innerHTML = bar + tilesBoard(c); actions.innerHTML = ''; }
    if (c.kind === 'meld') { main.innerHTML = meldBoard(c, s); actions.innerHTML = ''; }
    if (c.kind === 'clock') { main.innerHTML = bar + clockBoard(c, s); actions.innerHTML = clockKeys(c, s); }
    if (c.kind === 'pace') {
        const held = c.holding ? Math.max(0, c.hold_needed - Math.floor(s.now - c.hold_since)) : null;
        main.innerHTML = bar + `<div class="pace">
            <div class="pace-text">${esc(c.text)}</div>
            <div class="pace-status ${c.holding ? 'on' : ''}" id="pace-status">${c.holding ? `Hold still: ${held}` : 'Not there yet'}</div>
            <div class="note">Your location: ${myPos ? `±${Math.round(myPos.acc)} m` : 'waiting'}. It has to be ±30 m or better to count.</div>
        </div>`;
        actions.innerHTML = '';
    }
}

function chLeft(c) {
    if (c.kind === 'wordle' || c.kind === 'lock') { const n = c.max - c.guesses.length; return `${n} ${n === 1 ? 'try' : 'tries'} left`; }
    if (c.kind === 'switch') return `${c.max - c.moves} moves left`;
    if (c.kind === 'highlow') return `${c.score} of ${c.target} pts`;
    if (c.kind === 'tiles') return `${Object.keys(c.revealed).length} of ${c.need} safe`;
    if (c.kind === 'clock') return `${c.tries_left} ${c.tries_left === 1 ? 'try' : 'tries'} left`;
    return '';
}

function wordleBoard(c) {
    const rows = [];
    for (let r = 0; r < c.max; r++) {
        const g = c.guesses[r];
        const letters = g ? g.word : r === c.guesses.length ? draft.padEnd(5) : '     ';
        rows.push(`<div class="prow">${[...letters].map((ch, i) => `<div class="tile ${g ? g.marks[i] : ch.trim() ? 'typed' : ''}">${ch.trim().toUpperCase()}</div>`).join('')}</div>`);
    }
    return `<div class="word-board">${rows.join('')}</div>`;
}

function wordleKeys(c) {
    const best = {};
    const rank = { g: 3, y: 2, x: 1 };
    c.guesses.forEach(g => [...g.word].forEach((ch, i) => { if (!best[ch] || rank[g.marks[i]] > rank[best[ch]]) best[ch] = g.marks[i]; }));
    const row = s => [...s].map(ch => `<button class="kb ${best[ch] || ''}" data-type="${ch}">${ch.toUpperCase()}</button>`).join('');
    return `<div class="kbd">
        <div class="kbr">${row('qwertyuiop')}</div>
        <div class="kbr">${row('asdfghjkl')}</div>
        <div class="kbr"><button class="kb wide" data-ch="send">Enter</button>${row('zxcvbnm')}<button class="kb wide" data-type="del" aria-label="Delete">⌫</button></div>
    </div>`;
}

function lockBoard(c) {
    const rows = c.guesses.slice().reverse().map(g => `<div class="lrow"><span class="lcode">${[...g.code].map(d => `<b>${d}</b>`).join('')}</span><span class="lfb"><i class="dot-r"></i>${g.right} right spot <i class="dot-n"></i>${g.near} wrong spot</span></div>`).join('');
    return `<div class="lock">
        <div class="ldraft">${Array.from({ length: c.digits }, (_, i) => `<b class="${draft[i] ? 'typed' : ''}">${draft[i] || ''}</b>`).join('')}</div>
        <div class="lrows">${rows || '<div class="note">No tries yet. No digit repeats.</div>'}</div>
    </div>`;
}

function lockKeys() {
    const k = d => `<button class="kb num" data-type="${d}">${d}</button>`;
    return `<div class="kpad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(k).join('')}<button class="kb num" data-type="del" aria-label="Delete">⌫</button>${k(0)}<button class="kb num go" data-ch="send">Try</button></div>`;
}

// Two letters when two teammates share a first letter, so Mia and Max
// don't both show up as M.
function shortNames(names) {
    const firsts = names.filter(Boolean).map(n => n[0].toUpperCase());
    return names.map(n => {
        if (!n) return '';
        const one = n[0].toUpperCase();
        return firsts.filter(f => f === one).length > 1 ? n.slice(0, 2).toUpperCase() : one;
    });
}

function switchBoard(c) {
    const mine = c.mine || [];
    const short = shortNames(c.owner_names || []);
    const cells = c.lights.map((on, i) => {
        const owner = c.owner_names?.[i] || '';
        return `<button class="sw ${on ? 'on' : ''} ${mine[i] ? 'mine' : 'theirs'}" data-sw="${i}" aria-label="Switch ${i + 1}${on ? ', on' : ', off'}${mine[i] ? '' : `, ${esc(owner)}'s`}">${mine[i] ? '' : `<span>${esc(short[i])}</span>`}</button>`;
    }).join('');
    const shared = mine.some(m => !m);
    return `<div class="switch"><div class="grid" style="grid-template-columns:repeat(${c.size}, 1fr)">${cells}</div>
        ${shared ? `<div class="note">You control the bright-edged switches. Letters show whose the others are.</div>` : ''}</div>`;
}

function cardFace(n, suit) { return (n === 1 ? 'A' : String(n)) + (suit ? SUIT[suit].sym : ''); }

// High/Low cards look like real ones: corner marks and the pips laid out
// the way a deck lays them out. \uFE0E keeps phones from drawing emoji.
const SUIT = {
    spades: { sym: '\u2660\uFE0E', red: false }, hearts: { sym: '\u2665\uFE0E', red: true },
    diamonds: { sym: '\u2666\uFE0E', red: true }, clubs: { sym: '\u2663\uFE0E', red: false },
};
const PIPS = (() => {
    const L = 0.2, R = 0.8, M = 0.5;
    const corners = [[L, 0.18], [R, 0.18], [L, 0.82], [R, 0.82]];
    const sides4 = [[L, 0.18], [L, 0.39], [L, 0.61], [L, 0.82], [R, 0.18], [R, 0.39], [R, 0.61], [R, 0.82]];
    return {
        2: [[M, 0.18], [M, 0.82]],
        3: [[M, 0.18], [M, 0.5], [M, 0.82]],
        4: corners,
        5: [...corners, [M, 0.5]],
        6: [...corners, [L, 0.5], [R, 0.5]],
        7: [...corners, [L, 0.5], [R, 0.5], [M, 0.34]],
        8: [...corners, [L, 0.5], [R, 0.5], [M, 0.34], [M, 0.66]],
        9: [...sides4, [M, 0.5]],
        10: [...sides4, [M, 0.29], [M, 0.71]],
    };
})();
let shownCard = null;
function playingCard(n, suit) {
    const st = SUIT[suit] || SUIT.spades;
    const face = n === 1 ? 'A' : String(n);
    const pips = n === 1
        ? `<i class="pip ace" style="left:50%;top:50%">${st.sym}</i>`
        : PIPS[n].map(([x, y]) => `<i class="pip ${y > 0.5 ? 'flip' : ''}" style="left:${x * 100}%;top:${y * 100}%">${st.sym}</i>`).join('');
    // A new card turns over; the same card redrawn stays put.
    const key = `${n}${suit}`;
    const fresh = shownCard !== null && shownCard !== key;
    shownCard = key;
    return `<div class="pcard ${st.red ? 'red' : ''} ${fresh ? 'turn' : ''}" role="img" aria-label="${face} of ${suit || 'spades'}">
        <span class="idx tl"><b>${face}</b>${st.sym}</span>
        <div class="pips">${pips}</div>
        <span class="idx br"><b>${face}</b>${st.sym}</span>
    </div>`;
}

function highlowBoard(c) {
    const l = c.last;
    return `<div class="hl">
        ${playingCard(c.card, c.suit)}
        ${l ? `<div class="note">${cardFace(l.card, l.suit)}, called ${l.call}, drew ${cardFace(l.next, l.next_suit)}: ${l.win ? 'right' : 'wrong'}</div>` : '<div class="note">Is the next card higher or lower?</div>'}
        <div class="hl-score"><div><b>${c.score}</b><span>Banked</span></div><div><b>${c.pot}</b><span>Riding</span></div><div><b>${c.target}</b><span>Needed</span></div></div>
        ${c.streak ? `<div class="note">Next right call is worth ${c.streak + 1}.</div>` : ''}
    </div>`;
}

function highlowKeys(c) {
    // The calls are the main move, so they are the light keys; Bank is plain.
    return `<div class="row"><button class="key dark" data-bet="lower">Lower</button><button class="key dark" data-bet="higher">Higher</button></div>
        <button class="key" data-ch="bank" ${c.pot ? '' : 'disabled'}>Bank ${c.pot || ''}</button>`;
}

function tilesBoard(c) {
    const traps = new Set(c.trap_spots || []);
    const cells = Array.from({ length: c.size * c.size }, (_, i) => {
        const open = c.revealed[i] !== undefined;
        const n = c.revealed[i];
        const boom = c.boom === i;
        return `<button class="tile-b ${open ? 'open' : ''} ${boom ? 'boom' : ''} ${traps.has(i) && !boom ? 'trap' : ''}" data-flip="${i}" ${open ? 'disabled' : ''} aria-label="Tile ${i + 1}${open ? `, ${n} traps near` : ''}">${open ? (n || '') : boom || traps.has(i) ? '✕' : ''}</button>`;
    }).join('');
    return `<div class="switch"><div class="grid tiles" style="grid-template-columns:repeat(${c.size}, 1fr)">${cells}</div>
        <div class="note">${c.traps} traps hidden. A number is how many traps touch that tile.</div></div>`;
}

// Inner Clock. The tap time is counted on the phone against the server's
// clock, so a slow connection does not move it. Leaving the page during a
// run is reported with the tap and counts as a miss.
let clockHidden = false;
let clockRunKey = null;
document.addEventListener('visibilitychange', () => { if (document.hidden && state?.challenge?.run) clockHidden = true; });

function serverNow() { return Date.now() / 1000 - (state?.clientOffset || 0); }

function fmtClock(t) {
    t = Math.max(0, t);
    return `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}.${Math.floor((t * 10) % 10)}`;
}

function clockBoard(c, s) {
    const run = c.run;
    if (run) {
        const key = `${run.start}`;
        if (clockRunKey !== key) { clockRunKey = key; clockHidden = false; }
        return `<div class="clock-run ${serverNow() < run.start ? 'pre' : ''}">
            <div class="engr">Tap at</div>
            <div class="clock-target">${fmtClock(run.target).slice(0, -2)}</div>
            <div class="clock-face" id="clock-face"></div>
            <div class="note" id="clock-note">${run.mine ? `Tapped. ${run.tapped} of ${run.count} in` : run.playing ? 'Everyone taps on their own phone' : 'Watching this one'}</div>
        </div>`;
    }
    const last = c.history[c.history.length - 1];
    if (!last) return '';
    // The result as a timeline: the window that counts around the target,
    // a pin for each person's tap, and the team average under it.
    const off = last.taps.some(t => t.t != null) ? last.avg - last.target : null;
    const tapped = last.taps.filter(t => t.t != null);
    const spread = Math.max(c.buffer * 2, 3, ...tapped.map(t => Math.abs(t.t - last.target)), Math.abs(off || 0)) * 1.25;
    const pos = x => Math.max(2, Math.min(98, 50 + ((x - last.target) / spread) * 50));
    const sign = d => `${d > 0 ? '+' : d < 0 ? '\u2212' : '\u00B1'}${Math.abs(d).toFixed(1)}`;
    return `<div class="cr ${last.ok ? 'ok' : 'miss'}">
        <div class="cr-title">${last.ok ? 'Right on time' : last.why ? 'Missed' : `Off by ${Math.abs(off).toFixed(1)} s`}</div>
        <div class="cr-sub">${last.why && !last.ok ? `${esc(last.why[0].toUpperCase() + last.why.slice(1))}. ` : ''}Needed within \u00B1${c.buffer} s of ${fmtClock(last.target).slice(0, -2)}</div>
        <div class="cr-line">
            <div class="cr-window" style="left:${pos(last.target - c.buffer)}%;right:${100 - pos(last.target + c.buffer)}%"></div>
            <div class="cr-target" style="left:50%"><span>${fmtClock(last.target).slice(0, -2)}</span></div>
            ${tapped.map(t => `<div class="cr-tap" style="left:${pos(t.t)}%"><i>${esc(Array.from(t.name.trim())[0] || '?').toUpperCase()}</i></div>`).join('')}
            ${off != null ? `<div class="cr-avg" style="left:${pos(last.avg)}%"><span>Avg</span></div>` : ''}
        </div>
        <div class="cr-taps">${last.taps.map(t => `<div class="cr-row"><i>${esc(Array.from(t.name.trim())[0] || '?').toUpperCase()}</i><span>${esc(t.name)}</span><time>${t.t == null ? 'No tap' : fmtClock(t.t)}</time><b class="${t.t == null ? 'bad' : Math.abs(t.t - last.target) <= c.buffer ? 'good' : ''}">${t.t == null ? '' : sign(t.t - last.target)}</b></div>`).join('')}
            ${off != null ? `<div class="cr-row avg"><i>\u2300</i><span>Team average</span><time>${fmtClock(last.avg)}</time><b class="${last.ok ? 'good' : 'bad'}">${sign(off)}</b></div>` : ''}
        </div>
        ${!last.ok ? `<div class="cr-left">${c.tries_left} ${c.tries_left === 1 ? 'try' : 'tries'} left</div>` : ''}
    </div>`;
}

function clockKeys(c) {
    const run = c.run;
    if (!run) return `<button class="key dark" data-ch="run">Try again</button>`;
    if (!run.playing || run.mine) return '';
    return `<button class="key dark clock-tap" data-clock="tap">Tap</button>`;
}

// The visible timer runs smoothly for its first few seconds, then hides.
function clockFrame() {
    const c = state?.challenge;
    const face = document.getElementById('clock-face');
    if (c?.kind === 'clock' && c.run && face) {
        const t = serverNow() - c.run.start;
        face.textContent = t < 0 ? String(Math.ceil(-t)) : t < c.run.show ? fmtClock(t) : '';
        face.classList.toggle('hidden-time', t >= c.run.show);
        // During the 3, 2, 1 only the countdown shows: the target and the Tap
        // key come in when the clock starts.
        face.closest('.clock-run')?.classList.toggle('pre', t < 0);
        const tap = document.querySelector('.clock-tap');
        if (tap) tap.style.visibility = t < 0 ? 'hidden' : '';
    }
    requestAnimationFrame(clockFrame);
}
requestAnimationFrame(clockFrame);

function meldBoard(c, s) {
    const names = c.pair_names || [];
    const matches = (c.results || []).filter(r => r.match).length;
    const results = (c.results || []).slice().reverse().map(r => `<div class="answer"><span>${esc(r.q)}${r.trivia ? ' (trivia)' : ''}<br><small>${esc(names[0] || '')}: ${esc(r.a ?? 'no answer')} · ${esc(names[1] || '')}: ${esc(r.b ?? 'no answer')}</small></span><b class="${r.match ? 'yes' : 'no'}">${r.match ? 'Match' : 'Miss'}</b></div>`).join('');
    const head = `<div class="ch-bar"><span class="ch-name">Mind Meld</span><span class="ch-timer" id="meld-timer"></span><span class="ch-left">${matches} of ${c.need}</span></div>`;
    const q = c.question;
    const waitingStart = c.round_ends && s.now < c.round_ends - 10;
    let body = '';
    if (!c.playing) {
        body = `<div class="pace"><div class="pace-text">${esc(names.join(' and '))} are playing. Stay quiet.</div>${q && !waitingStart ? `<div class="note">Round ${c.round + 1} of ${c.rounds}: ${esc(q.q)}</div>` : ''}</div>`;
    } else if (q && waitingStart) {
        body = `<div class="pace"><div class="pace-text">Get ready. Round ${c.round + 1} of ${c.rounds}</div></div>`;
    } else if (q) {
        body = `<div class="pace">
            <div class="engr">Round ${c.round + 1} of ${c.rounds}${q.trivia ? ' · trivia, pick the right one' : ''}</div>
            <div class="pace-text">${esc(q.q)}</div>
            <div class="meld-opts">${q.options.map(o => `<button class="key ${c.mine === o.i ? 'dark' : ''}" data-meld="${o.i}" ${c.mine != null ? 'disabled' : ''}>${esc(o.text)}</button>`).join('')}</div>
            <div class="note">${c.mine != null ? (c.answered === 2 ? 'Both locked in' : 'Locked in. Waiting for your teammate') : 'Pick before time runs out'}</div>
        </div>`;
    }
    return head + body + (results ? `<div class="answers">${results}</div>` : '');
}

async function chSend(action, value) {
    const j = await api('/api/challenge', { code: CODE, token, action, value });
    if (j && !j.ok && j.message) toast(j.message);
    // A key the page disabled while sending comes back if nothing changed.
    if (!j || !j.ok) redraw();
    return j || {};
}

document.addEventListener('click', async e => {
    const c = state?.challenge;
    if (!c) return;
    const t = e.target.closest('[data-type], [data-ch], [data-sw], [data-flip], [data-bet], [data-meld], [data-clock]');
    if (!t || t.disabled) return;
    if (t.dataset.ch === 'start') { t.disabled = true; await chSend('start'); return; }
    if (t.dataset.ch === 'reset') { await chSend('reset'); return; }
    if (t.dataset.sw) { await chSend('press', +t.dataset.sw); return; }
    if (t.dataset.flip) { await chSend('flip', +t.dataset.flip); return; }
    if (t.dataset.bet) { await chSend('bet', t.dataset.bet); return; }
    if (t.dataset.ch === 'bank') { await chSend('bank'); return; }
    if (t.dataset.meld) { await chSend('answer', +t.dataset.meld); return; }
    if (t.dataset.clock) {
        const elapsed = serverNow() - c.run.start;
        if (elapsed < 0) { toast('Not started yet'); return; }
        t.disabled = true;
        await chSend('tap', { elapsed, hidden: clockHidden });
        return;
    }
    if (t.dataset.ch === 'run') { t.disabled = true; await chSend('run'); return; }
    const max = c.kind === 'wordle' ? 5 : c.digits;
    if (t.dataset.type === 'del') draft = draft.slice(0, -1);
    else if (t.dataset.type) {
        if (c.kind === 'lock' && draft.includes(t.dataset.type)) toast('No repeated digits');
        else if (draft.length < max) draft += t.dataset.type;
    }
    if (t.dataset.ch === 'send') {
        if (draft.length !== max) { toast(c.kind === 'wordle' ? 'Five letters' : `${max} digits`); return; }
        const sent = draft;
        const j = await chSend('guess', sent);
        if (j.ok) draft = '';
    }
    renderChallenge(state);
});

// A physical keyboard works too, for the game master's test windows.
document.addEventListener('keydown', e => {
    const c = state?.challenge;
    if (!c || chPhase(c, state.now) !== 'playing' || !['wordle', 'lock'].includes(c.kind)) return;
    const k = e.key.toLowerCase();
    let btn = null;
    if (k === 'enter') btn = document.querySelector('[data-ch="send"]');
    else if (k === 'backspace') btn = document.querySelector('[data-type="del"]');
    else btn = document.querySelector(`[data-type="${CSS.escape(k)}"]`);
    if (btn) { e.preventDefault(); btn.click(); }
});

// ------------------------------------------------------------ actions

document.addEventListener('click', async e => {
    const ci = e.target.closest('#checkin');
    if (ci && !ci.disabled) {
        checkingIn = true;
        redraw();
        try {
            const reading = await freshReading();
            const j = await api('/api/checkin', { code: CODE, token, reading });
            if (j && !j.ok) toast(j.message || 'Could not check in');
        } finally { checkingIn = false; redraw(); }
        return;
    }
    const sw = e.target.closest('[data-switch]');
    if (sw && state?.status === 'lobby') {
        const j = await api('/api/switch', { code: CODE, token, team: sw.dataset.switch });
        if (j && j.error) toast(j.error);
        return;
    }
    if (e.target.closest('#invite')) { openInvite(); return; }
    if (e.target.closest('#shuffle')) {
        if (!confirm('Shuffle everyone into new teams?')) return;
        const j = await api(`/api/games/${CODE}/shuffle`, { token });
        if (j && j.error) toast(j.error);
        return;
    }
    const tk = e.target.closest('[data-teams]');
    if (tk && !tk.disabled && state && +tk.dataset.teams !== Object.keys(state.roster || {}).length) {
        if (+tk.dataset.teams === 2 && !confirm('Remove the yellow team? Anyone on it moves to another team, and the routes are picked again.')) return;
        teamsBusy = +tk.dataset.teams;
        render(state);
        const j = await api(`/api/games/${CODE}/teams`, { token, teams: teamsBusy });
        if (j && j.error) toast(j.error);
        teamsBusy = 0;
        render(state);
        return;
    }
    if (e.target.closest('#exit')) {
        if (!confirm('Leave this game?')) return;
        const j = await api('/api/leave', { code: CODE, token });
        if (!j) return;
        if (j.error) { toast(j.error); return; }
        if (SIM) sessionStorage.removeItem(SEAT); else store.del(SEAT);
        location.href = '/';
        return;
    }
    const share = e.target.closest('#share, #self-start');
    if (share?.id === 'share') {
        const link = `${SHARE_ORIGIN}/?g=${CODE}`;
        try { if (navigator.share) await navigator.share({ title: 'GGWP', url: link }); else { await navigator.clipboard.writeText(link); toast('Link copied'); } } catch (err) {}
        return;
    }
    if (share?.id === 'self-start') {
        if (!confirm('Start the game for everyone?')) return;
        share.disabled = true;
        const j = await api('/api/self-start', { code: CODE, token });
        if (!j || j.error) { if (j) toast(j.error || 'Could not start'); redraw(); }
        return;
    }
    const b = e.target.closest('[data-radar], [data-ask], #here');
    if (!b || b.disabled) return;
    if (b.id === 'here') {
        if (!confirm('Ask the game master to confirm you are at the spot?')) return;
        const j = await api('/api/here', { code: CODE, token });
        if (j && j.error) toast(j.error);
        return;
    }
    await flush();
    const body = b.dataset.radar ? { kind: 'radar', size: +b.dataset.radar } : { kind: b.dataset.ask };
    const j = await api('/api/ask', { code: CODE, token, ...body });
    if (!j) return;
    const q = body.kind === 'radar' ? `Within ${body.size} m? ` : body.kind === 'thermo' ? '' : '';
    toast(j.ok ? q + j.message : j.message || j.error);
});

// ------------------------------------------------------------ location

let myPos = null;
let queue = [];

function sendFix(fix) {
    myPos = fix;
    const gps = document.getElementById('gps');
    if (gps) gps.innerHTML = `<i class="led ${fix.acc <= 50 ? 'on' : ''}"></i><span>${SIM ? 'Test mode' : fix.acc <= 50 ? `Location on · ±${Math.round(fix.acc)} m` : `Weak location · ±${Math.round(fix.acc)} m`}</span>`;
    queue.push(fix);
    if (state) drawMap(state);
    if (follow && map && !SIM) map.easeTo({ center: [fix.lon, fix.lat], duration: 400 });
    flush();
}

// Fixes wait in a queue and go up in a batch. A dropped connection keeps
// them, and they all arrive once it is back, so the game master's trail has
// no hole in it.
let sending = false;
async function flush() {
    if (sending || !queue.length || !token) return;
    sending = true;
    const batch = queue.slice(0, 30);
    try {
        const r = await fetch('/api/pos', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ code: CODE, token, fixes: batch }) });
        if (r.ok) queue = queue.slice(batch.length);
        else if (r.status === 403 || r.status === 404) queue = [];
    } catch (e) {}
    sending = false;
}
setInterval(flush, 4000);
// Standing still, a phone often reports nothing new. Resend the last spot
// every few seconds so "hold still" challenges and arrivals keep counting.
setInterval(() => {
    if (myPos && Date.now() / 1000 - myPos.t > 2.5) sendFix({ ...myPos, t: Date.now() / 1000 });
}, 2500);

function watchLocation() {
    if (SIM) return;
    if (!navigator.geolocation) { toast('This browser has no location'); return; }
    // At most one fix every 3 seconds. A fix that comes in sooner is held
    // and sent when the 3 seconds are up, so the newest spot always lands.
    let last = 0, held = null, timer = null;
    const send = () => { timer = null; last = Date.now(); sendFix(held); };
    navigator.geolocation.watchPosition(p => {
        const now = Date.now();
        held = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy, t: now / 1000 };
        if (now - last >= 3000) { clearTimeout(timer); send(); }
        else if (!timer) timer = setTimeout(send, 3000 - (now - last));
    }, err => {
        if (err.code === 1) {
            toast('Location is off. Allow it in settings');
            const gps = document.getElementById('gps');
            if (gps) gps.innerHTML = '<i class="led"></i><span>Location is off</span>';
        }
    }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
}

// The screen staying on is what keeps location flowing. The lock is dropped
// whenever the page is hidden, so it is asked for again on the way back.
let wake = null;
async function keepAwake() {
    try { if ('wakeLock' in navigator && document.visibilityState === 'visible') wake = await navigator.wakeLock.request('screen'); } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { keepAwake(); flush(); } });

// ------------------------------------------------------------ live

// Connection light. The server sends something at least every 15 seconds, so
// 25 seconds of nothing means the signal is gone.
let lastSeen = 0;
let online = true;
function setNet(on) {
    online = on;
    const el = document.getElementById('net');
    if (!el) return;
    const ago = lastSeen ? Math.round((Date.now() / 1000 - lastSeen) / 60) : null;
    el.innerHTML = on ? '<i class="led on"></i><span>Live</span>'
        : `<i class="led off-net blink"></i><span>No signal${ago ? ` · last update ${ago} min ago` : ''}</span>`;
    el.classList.toggle('down', !on);
}
setInterval(() => { if (lastSeen && Date.now() / 1000 - lastSeen > 25) setNet(false); }, 5000);

function startGame() {
    shell();
    watchLocation();
    keepAwake();
    let lastRace = null, lastIndex = null, lastWinner = null, lastFails = null, hadChallenge = false, lastPending = false, lastHints = null, lastStatus = null;
    // The last update is kept on the phone, so reopening the page with no
    // signal still shows the clue instead of a blank screen.
    const CACHE = `ggwp-last-${CODE}-${String(token).slice(0, 8)}`;
    try {
        const cached = JSON.parse(store.get(CACHE) || 'null');
        if (cached && cached.view && !state) {
            state = cached.view;
            state.clientOffset = cached.at - cached.view.now;
            lastSeen = cached.at;
            render(state);
            setNet(false);
        }
    } catch (e) {}
    const es = new EventSource(`/api/stream?g=${CODE}&p=${encodeURIComponent(token)}`);
    es.onopen = () => { setNet(true); flush(); };
    es.onmessage = e => {
        const s = JSON.parse(e.data);
        lastSeen = Date.now() / 1000;
        setNet(true);
        store.set(CACHE, JSON.stringify({ view: s, at: lastSeen }));
        const buzz = pattern => { try { navigator.vibrate?.(pattern); } catch (e) {} };
        if (lastIndex !== null && s.index > lastIndex && s.status === 'running') {
            celebrate(s.last_how === 'gm' ? 'Passed!' : 'Cleared!', `Stop ${lastIndex + 1} done`,
                s.stop?.final ? 'Final spot unlocked' : 'Next clue is up');
        }
        // Another team cleared a stop: say so, with a short buzz.
        if (lastRace && s.status === 'running') {
            for (const r of s.race) {
                if (r.team !== s.me.team && lastRace[r.team] != null && r.index > lastRace[r.team]) {
                    toast(r.index >= s.total - 1 ? `${cap(r.team)} unlocked their final spot` : `${cap(r.team)} cleared stop ${r.index}`);
                    buzz([40]);
                }
            }
        }
        lastRace = Object.fromEntries(s.race.map(r => [r.team, r.index]));
        if (lastPending && !s.pending && s.index === lastIndex && !s.challenge) toast('The game master says not yet');
        const hintCount = s.stop ? s.stop.hints.length : 0;
        if (lastHints !== null && lastStatus === 'running' && !s.challenge && s.index === lastIndex && hintCount > lastHints) { toast('New hint'); buzz([120]); }
        lastHints = hintCount;
        lastStatus = s.status;
        lastPending = s.pending;
        if (s.challenge && !hadChallenge && lastIndex !== null) arrivedAt(s);
        if (s.challenge && lastFails !== null && s.challenge.fails > lastFails) toast('Failed. Next try in 5:00');
        lastIndex = s.index;
        hadChallenge = !!s.challenge;
        lastFails = s.challenge ? s.challenge.fails : null;
        state = s;
        state.clientOffset = Date.now() / 1000 - s.now;
        render(s);
        drawMap(s);
    };
    const leaveSeat = () => {
        es.close();
        if (SIM) sessionStorage.removeItem(SEAT); else store.del(SEAT);
        token = null;
    };
    // Left from another tab, or removed: back to the join screen.
    es.addEventListener('gone', () => { leaveSeat(); joinScreen(); });
    document.addEventListener('click', e => {
        if (!e.target.closest('#done')) return;
        leaveSeat();
        location.href = '/';
    });
    es.onerror = async () => {
        setNet(false);
        // A token the server does not know means the game was reset.
        const r = await fetch(`/api/stream?g=${CODE}&p=${encodeURIComponent(token)}`, { method: 'HEAD' }).catch(() => null);
        if (r && (r.status === 403 || r.status === 404)) {
            leaveSeat();
            joinScreen();
        }
    };
    setInterval(() => {
        if (!state) return;
        state.now = Date.now() / 1000 - state.clientOffset;
        const nh = document.getElementById('next-hint');
        if (nh && state.stop?.next_hint_at) nh.textContent = `Next hint in ${mmss(state.stop.next_hint_at - state.now)}`;
        const c = state.challenge;
        if (c) {
            const phase = chPhase(c, state.now);
            if (phase !== renderChallenge.lastPhase) { renderChallenge.lastPhase = phase; render(state); }
            const w = document.getElementById('ch-wait');
            if (w && c.locked_until) w.textContent = mmss(c.locked_until - state.now);
            const t = document.getElementById('ch-timer');
            if (t && c.deadline) { const left = c.deadline - state.now; t.textContent = mmss(left); t.classList.toggle('low', left < 60); }
            const mt = document.getElementById('meld-timer');
            if (mt && c.round_ends) {
                const left = c.round_ends - state.now;
                mt.textContent = left > 10 || left <= 0 ? '' : `0:${String(Math.ceil(left)).padStart(2, '0')}`;
                if (left <= 10 && left > 9 && renderChallenge.meldRound !== c.round_ends) { renderChallenge.meldRound = c.round_ends; render(state); }
            }
            const ps = document.getElementById('pace-status');
            if (ps && c.holding) ps.textContent = `Hold still: ${Math.max(0, c.hold_needed - Math.floor(state.now - c.hold_since))}`;
        }
        const mw = document.getElementById('mark-walk');
        if (mw && state.mark && myPos) mw.textContent = `${Math.min(80, Math.round(dist(myPos, { lat: state.mark[0], lon: state.mark[1] })))} of 80 m`;
        const rest = document.getElementById('checkin-rest');
        if (rest && state.checkin_locked_until) {
            if (state.checkin_locked_until <= state.now) render(state);
            else rest.textContent = mmss(state.checkin_locked_until - state.now);
        }
        const cool = document.getElementById('cool');
        if (cool && state.cooldown_until) {
            if (state.cooldown_until <= state.now) render(state);
            else cool.textContent = `Next question in ${mmss(state.cooldown_until - state.now)}`;
        }
    }, 1000);
}

// GPS test: /?gpstest. For a walk around the park before game day: live
// accuracy, and whether a check-in would pass at the nearest landmarks.
async function gpsTest() {
    const marks = await fetch('/api/landmarks').then(r => r.json()).catch(() => []);
    app.innerHTML = `<div class="join"><div class="device">
        <div class="screen"><div class="screen-top"><span><i class="led on blink"></i>GPS test</span><span>No game</span></div>
            <div class="big-line" id="gt-acc">Waiting for location</div>
            <div class="screen-line">Walk to a landmark and watch whether a check-in would pass. Keep this screen open.</div></div>
        <div class="answers" id="gt-list" style="padding:0"></div>
    </div></div>`;
    const draw = fix => {
        document.getElementById('gt-acc').textContent = `Accuracy ±${Math.round(fix.acc)} m`;
        const near = marks.map(m => ({ ...m, d: dist(fix, m) })).sort((a, b) => a.d - b.d).slice(0, 6);
        document.getElementById('gt-list').innerHTML = near.map(m => {
            const pass = fix.acc <= 50 && m.d <= m.radius + Math.min(fix.acc, 50) / 2;
            return `<div class="answer"><span>${esc(m.name)}<br><small>${Math.round(m.d)} m away, circle ${m.radius} m</small></span><b class="${pass ? 'yes' : 'no'}">${pass ? 'Would pass' : 'No'}</b></div>`;
        }).join('');
    };
    navigator.geolocation?.watchPosition(p => draw({ lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy }),
        () => { document.getElementById('gt-acc').textContent = 'Location is off'; }, { enableHighAccuracy: true, maximumAge: 0 });
    keepAwake();
}

function dist(a, b) {
    const k = Math.cos(((a.lat + b.lat) / 2) * Math.PI / 180);
    return Math.hypot((a.lat - b.lat) * 111320, (a.lon - b.lon) * 111320 * k);
}

// Lets the page open with no signal; see sw.js.
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});

if (params.has('gpstest')) gpsTest();
else if (token) startGame(); else joinScreen();
</script>
